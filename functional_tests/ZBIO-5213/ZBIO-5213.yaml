openapi: 3.0.3
info:
  title: Credit Card Collection Lifecycle Notification System API
  description: |
    API for automating collection lifecycle notifications to credit card holders.
    Provides endpoints for managing payment reminders, overdue alerts, collection notices,
    payment plans, agency referrals, and legal actions while ensuring PCI-DSS compliance
    through credit card number masking and secure data handling.
  version: 1.0.0
  contact:
    name: API Support Team
    email: api-support@example.com

servers:
  - url: https://api.collections.example.com/v1
    description: Production server
  - url: https://api-staging.collections.example.com/v1
    description: Staging server
  - url: https://api-dev.collections.example.com/v1
    description: Development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Notifications
    description: Collection lifecycle notification management
  - name: Payment Plans
    description: Payment plan proposal and management
  - name: Collection Agency
    description: Collection agency referral and escalation
  - name: Legal Actions
    description: Legal action initiation and documentation
  - name: Audit
    description: Audit trail and compliance logging
  - name: Account Management
    description: Account status and lifecycle management

paths:
  /notifications/due-reminder:
    post:
      tags:
        - Notifications
      summary: Send due reminder notification before payment due date
      description: |
        Generates and sends a payment due reminder notification to cardholders
        before the payment due date. Automatically masks credit card numbers
        showing only last 4 digits.
      operationId: sendDueReminder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DueReminderRequest'
            examples:
              emailReminder:
                summary: Email reminder 5 days before due date
                value:
                  accountId: "ACC-001"
                  last4Digits: "1234"
                  dueDate: "2024-02-15"
                  reminderDays: 5
                  contactChannel: "email"
                  contactInfo: "cardholder1@example.com"
                  amountDue: "$500.00"
              smsReminder:
                summary: SMS reminder 7 days before due date
                value:
                  accountId: "ACC-002"
                  last4Digits: "5678"
                  dueDate: "2024-02-20"
                  reminderDays: 7
                  contactChannel: "sms"
                  contactInfo: "+1-555-0102"
                  amountDue: "$1200.50"
      responses:
        '201':
          description: Reminder notification successfully created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
              examples:
                success:
                  value:
                    notificationId: "NOTIF-2024-001"
                    accountId: "ACC-001"
                    notificationType: "due_reminder"
                    maskedCardNumber: "**** **** **** 1234"
                    status: "SUCCESS"
                    deliveryChannel: "email"
                    deliveryTimestamp: "2024-02-10T10:30:00Z"
                    message: "Due reminder notification sent successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/overdue-alert:
    post:
      tags:
        - Notifications
      summary: Send overdue balance alert after missed payment due date
      description: |
        Generates and sends an overdue balance alert when payment due date
        has passed without payment. Includes late fee information and consequences.
      operationId: sendOverdueAlert
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverdueAlertRequest'
            examples:
              emailAlert:
                summary: Overdue alert via email
                value:
                  accountId: "ACC-005"
                  last4Digits: "7890"
                  dueDate: "2024-01-15"
                  detectionDate: "2024-01-16"
                  overdueAmount: "$500.00"
                  lateFee: "$35.00"
                  consequences: "late fees and interest charges"
                  contactChannel: "email"
      responses:
        '201':
          description: Overdue alert successfully created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/collection-notice:
    post:
      tags:
        - Notifications
      summary: Send formal collection notification for significantly delinquent accounts
      description: |
        Generates formal collection notification for accounts that have reached
        delinquency threshold. Includes itemized charges and payment deadline.
      operationId: sendCollectionNotice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionNoticeRequest'
            examples:
              sixtyDaysOverdue:
                summary: Collection notice for 60 days overdue
                value:
                  accountId: "ACC-009"
                  last4Digits: "9012"
                  daysOverdue: 60
                  thresholdDays: 60
                  totalOwed: "$1500.00"
                  additionalCharges: "Late fees: $105, Interest: $75"
                  escalationDate: "2024-03-15"
                  paymentDeadline: "2024-03-30"
      responses:
        '201':
          description: Collection notice successfully created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment-plans/proposals:
    post:
      tags:
        - Payment Plans
      summary: Generate and send payment plan proposal to cardholder
      description: |
        Creates a structured payment plan proposal for accounts with significant
        overdue balances. Includes installment schedule and terms.
      operationId: createPaymentPlanProposal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanProposalRequest'
            examples:
              twelveMonthPlan:
                summary: 12-month payment plan
                value:
                  accountId: "ACC-012"
                  last4Digits: "3456"
                  overdueBalance: "$1500.00"
                  planDuration: 12
                  interestRate: 5.0
                  installmentAmount: "$131.25"
                  totalRepayment: "$1575.00"
                  generationDate: "2024-03-01"
                  deliveryChannel: "email"
      responses:
        '201':
          description: Payment plan proposal successfully created and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment-plans/{proposalId}/accept:
    post:
      tags:
        - Payment Plans
      summary: Accept payment plan proposal
      description: |
        Records cardholder acceptance of payment plan and creates scheduled
        payment installments. Pauses collection lifecycle notifications.
      operationId: acceptPaymentPlan
      security:
        - BearerAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          description: Unique identifier of the payment plan proposal
          schema:
            type: string
            example: "PLAN-2024-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanAcceptanceRequest'
      responses:
        '200':
          description: Payment plan successfully accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanAcceptanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment-plans/{planId}/default:
    post:
      tags:
        - Payment Plans
      summary: Process payment plan default
      description: |
        Handles payment plan default when consecutive installments are missed.
        Terminates plan and resumes collection lifecycle.
      operationId: defaultPaymentPlan
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          description: Unique identifier of the active payment plan
          schema:
            type: string
            example: "PLAN-2024-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanDefaultRequest'
      responses:
        '200':
          description: Payment plan default processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanDefaultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-agency/referrals:
    post:
      tags:
        - Collection Agency
      summary: Escalate to collection agency with secure data sharing
      description: |
        Initiates collection agency referral for severely delinquent accounts.
        Prepares secure data package with masked credit card information.
      operationId: createAgencyReferral
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyReferralRequest'
            examples:
              ninetyDaysOverdue:
                summary: Agency referral after 90 days
                value:
                  accountId: "ACC-016"
                  last4Digits: "7890"
                  overdueBalance: "$1500.00"
                  notificationCount: 5
                  daysOverdue: 90
                  referralThreshold: 90
                  referralDate: "2024-04-01"
                  agencyName: "Professional Collections"
                  agencyContact: "+1-800-555-0201"
      responses:
        '201':
          description: Agency referral successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyReferralResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /legal-actions:
    post:
      tags:
        - Legal Actions
      summary: Initiate legal action documentation for extreme delinquency
      description: |
        Initiates legal action process for accounts with extreme delinquency
        after all collection efforts have been exhausted.
      operationId: initiateLegalAction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalActionRequest'
            examples:
              legalAction120Days:
                summary: Legal action after 120 days
                value:
                  accountId: "ACC-019"
                  last4Digits: "2468"
                  daysOverdue: 120
                  outstandingBalance: "$5000.00"
                  minBalance: "$3000.00"
                  minDays: 120
                  initiationDate: "2024-05-01"
                  legalDeadline: "2024-05-31"
                  legalApprovalObtained: true
      responses:
        '201':
          description: Legal action successfully initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}/status:
    get:
      tags:
        - Account Management
      summary: Get account collection lifecycle status
      description: |
        Retrieves current collection lifecycle status and history for an account.
        Returns masked credit card information only.
      operationId: getAccountStatus
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the cardholder account
          schema:
            type: string
            example: "ACC-001"
      responses:
        '200':
          description: Account status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Account Management
      summary: Update account status
      description: Updates account status in collection lifecycle
      operationId: updateAccountStatus
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the cardholder account
          schema:
            type: string
            example: "ACC-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusUpdateRequest'
      responses:
        '200':
          description: Account status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}/lifecycle:
    get:
      tags:
        - Account Management
      summary: Get collection lifecycle progression history
      description: |
        Retrieves complete collection lifecycle progression history with
        all stage transitions and notifications sent.
      operationId: getLifecycleHistory
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier of the cardholder account
          schema:
            type: string
            example: "ACC-028"
      responses:
        '200':
          description: Lifecycle history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/validate-masking:
    post:
      tags:
        - Notifications
      summary: Validate credit card number masking
      description: |
        Validates that credit card number masking is properly applied across
        all notification types and delivery channels.
      operationId: validateMasking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskingValidationRequest'
      responses:
        '200':
          description: Masking validation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskingValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/batch:
    post:
      tags:
        - Notifications
      summary: Process batch notifications
      description: |
        Processes high volume of notifications for load testing and
        production batch processing scenarios.
      operationId: processBatchNotifications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNotificationRequest'
      responses:
        '202':
          description: Batch processing accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{notificationId}/retry:
    post:
      tags:
        - Notifications
      summary: Retry failed notification with fallback mechanism
      description: |
        Attempts to resend failed notification using configured fallback
        delivery channel.
      operationId: retryNotification
      security:
        - BearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          description: Unique identifier of the failed notification
          schema:
            type: string
            example: "NOTIF-2024-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRetryRequest'
      responses:
        '200':
          description: Notification retry completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit/logs:
    get:
      tags:
        - Audit
      summary: Retrieve audit logs for compliance
      description: |
        Retrieves comprehensive audit logs for collection activities.
        Supports filtering by account, date range, and activity type.
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: query
          description: Filter by account ID
          schema:
            type: string
            example: "ACC-057"
        - name: startDate
          in: query
          description: Start date for audit log retrieval
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: endDate
          in: query
          description: End date for audit log retrieval
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: activityType
          in: query
          description: Filter by activity type
          schema:
            type: string
            enum:
              - notification_sent
              - payment_received
              - status_updated
              - notification_failed
              - fallback_triggered
              - agency_referral
              - data_package_sent
              - cardholder_notified
            example: "notification_sent"
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of records per page
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /compliance/regulatory-check:
    post:
      tags:
        - Audit
      summary: Perform regulatory compliance check
      description: |
        Validates that notification complies with FDCPA, time restrictions,
        and other regulatory requirements.
      operationId: performRegulatoryCheck
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegulatoryCheckRequest'
      responses:
        '200':
          description: Regulatory check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegulatoryCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/health:
    get:
      tags:
        - System
      summary: Check system health status
      description: Health check endpoint for monitoring notification service
      operationId: getSystemHealth
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for service-to-service authentication

  schemas:
    DueReminderRequest:
      type: object
      required:
        - accountId
        - last4Digits
        - dueDate
        - reminderDays
        - contactChannel
        - contactInfo
        - amountDue
      properties:
        accountId:
          type: string
          description: Unique identifier of the cardholder account
          example: "ACC-001"
          pattern: '^ACC-[0-9]{3,}$'
        last4Digits:
          type: string
          description: Last 4 digits of credit card number
          example: "1234"
          pattern: '^[0-9]{4}$'
        dueDate:
          type: string
          format: date
          description: Payment due date
          example: "2024-02-15"
        reminderDays:
          type: integer
          description: Number of days before due date to send reminder
          example: 5
          minimum: 1
          maximum: 30
        contactChannel:
          type: string
          description: Preferred communication channel
          enum:
            - email
            - sms
            - postal_mail
          example: "email"
        contactInfo:
          type: string
          description: Contact information for delivery
          example: "cardholder1@example.com"
        amountDue:
          type: string
          description: Payment amount due
          example: "$500.00"
          pattern: '^\$[0-9]+\.[0-9]{2}$'

    OverdueAlertRequest:
      type: object
      required:
        - accountId
        - last4Digits
        - dueDate
        - detectionDate
        - overdueAmount
        - lateFee
        - consequences
        - contactChannel
      properties:
        accountId:
          type: string
          description: Unique identifier of the cardholder account
          example: "ACC-005"
          pattern: '^ACC-[0-9]{3,}$'
        last4Digits:
          type: string
          description: Last 4 digits of credit card number
          example: "7890"
          pattern: '^[0-9]{4}$'
        dueDate:
          type: string
          format: date
          description: Original payment due date
          example: "2024-01-15"
        detectionDate:
          type: string
          format: date
          description: Date when missed payment was detected
          example: "2024-01-16"
        overdueAmount:
          type: string
          description: Amount currently overdue
          example: "$500.00"
          pattern: '^\$[0-9]+\.[0-9]{2}$'
        lateFee:
          type: string
          description: Late fee amount
          example: "$35.00"
          pattern: '^\$[0-9]+\.[0-9]{2}$'
        consequences:
          type: string
          description: Description of potential consequences
          example: "late fees and interest charges"
        contactChannel:
          type: string
          description: Delivery channel for alert
          enum:
            - email
            - sms
            - postal_mail
          example: "email"

    CollectionNoticeRequest:
      type: object
      required:
        - accountId
        - last4Digits
        - daysOverdue
        - thresholdDays
        - totalOwed
        - additionalCharges
        - escalationDate
        - paymentDeadline
      properties:
        accountId:
          type: string
          description: Unique identifier of the cardholder account
          example: "ACC-009"
          pattern: '^ACC-[0-9]{3,}$'
        last4Digits:
          type: string
          description: Last 4 digits of credit card number
          example: "9012"
          pattern: '^[0-9]{4}$'
        daysOverdue:
          type: integer
          description: Number of days account has been overdue
