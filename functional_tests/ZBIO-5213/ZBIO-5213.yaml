openapi: 3.0.3
info:
  title: Credit Card Collection Lifecycle Notification System API
  description: |
    API specification for automating collection lifecycle notifications to cardholders.
    Ensures payment reminders and collection actions are timely, secure, and compliant with PCI-DSS and regulatory requirements.
    
    **Security Features:**
    - Credit card number masking (only last 4 digits visible)
    - Encryption at rest and in transit
    - Comprehensive audit logging
    - PCI-DSS compliance
    
    **Key Capabilities:**
    - Due date reminder notifications
    - Overdue balance alerts
    - Formal collection notices
    - Payment plan proposals and management
    - Collection agency escalation
    - Legal action documentation
    - Multi-channel delivery (email, SMS, postal mail)
    - Regulatory compliance (FDCPA)
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@creditcard-issuer.com

servers:
  - url: https://api.creditcard-issuer.com/v1
    description: Production server
  - url: https://api-staging.creditcard-issuer.com/v1
    description: Staging server
  - url: https://api-dev.creditcard-issuer.com/v1
    description: Development server

tags:
  - name: Notifications
    description: Collection lifecycle notification operations
  - name: Payment Plans
    description: Payment plan management and proposals
  - name: Accounts
    description: Cardholder account operations
  - name: Collection Agency
    description: Collection agency escalation and management
  - name: Legal Actions
    description: Legal action documentation and processing
  - name: Audit
    description: Audit trail and compliance reporting
  - name: System Configuration
    description: System configuration and health checks

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /notifications/due-reminder:
    post:
      tags:
        - Notifications
      summary: Send due reminder notification
      description: |
        Generates and sends a payment due reminder notification to a cardholder before the payment due date.
        The notification displays only the last 4 digits of the credit card number in masked format.
      operationId: sendDueReminder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DueReminderRequest'
            examples:
              emailReminder:
                summary: Email reminder 5 days before due date
                value:
                  accountId: "ACC-001"
                  last4Digits: "1234"
                  dueDate: "2024-02-15"
                  reminderDays: 5
                  contactChannel: "email"
                  contactInfo: "cardholder1@example.com"
                  amountDue: "$500.00"
              smsReminder:
                summary: SMS reminder 7 days before due date
                value:
                  accountId: "ACC-002"
                  last4Digits: "5678"
                  dueDate: "2024-02-20"
                  reminderDays: 7
                  contactChannel: "sms"
                  contactInfo: "+1-555-0102"
                  amountDue: "$1200.50"
      responses:
        '201':
          description: Due reminder notification created and sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
              examples:
                success:
                  value:
                    notificationId: "NOTIF-DR-001"
                    accountId: "ACC-001"
                    notificationType: "due_reminder"
                    maskedCardNumber: "**** **** **** 1234"
                    deliveryStatus: "SUCCESS"
                    deliveryChannel: "email"
                    deliveryTimestamp: "2024-02-10T10:00:00Z"
                    dueDate: "2024-02-15"
                    amountDue: "$500.00"
                    auditLogId: "AUDIT-001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidAccountState'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/overdue-alert:
    post:
      tags:
        - Notifications
      summary: Send overdue balance alert
      description: |
        Generates and sends an overdue balance alert after a missed payment due date.
        Includes late fee information and potential consequences.
      operationId: sendOverdueAlert
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverdueAlertRequest'
            examples:
              overdueEmail:
                summary: Overdue alert via email
                value:
                  accountId: "ACC-005"
                  last4Digits: "7890"
                  dueDate: "2024-01-15"
                  detectionDate: "2024-01-16"
                  overdueAmount: "$500.00"
                  lateFee: "$35.00"
                  consequences: "late fees and interest charges"
                  contactChannel: "email"
      responses:
        '201':
          description: Overdue alert notification created and sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/collection-notice:
    post:
      tags:
        - Notifications
      summary: Send formal collection notification
      description: |
        Generates and sends a formal collection notification for significantly delinquent accounts.
        Includes detailed breakdown of amounts owed and payment deadline.
      operationId: sendCollectionNotice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionNoticeRequest'
            examples:
              collectionNotice60Days:
                summary: Collection notice for 60 days overdue
                value:
                  accountId: "ACC-009"
                  last4Digits: "9012"
                  daysOverdue: 60
                  thresholdDays: 60
                  totalOwed: "$1500.00"
                  additionalCharges:
                    lateFees: "$105.00"
                    interest: "$75.00"
                  escalationDate: "2024-03-15"
                  paymentDeadline: "2024-03-30"
      responses:
        '201':
          description: Collection notice created and sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/payment-plan-proposal:
    post:
      tags:
        - Payment Plans
      summary: Generate and send payment plan proposal
      description: |
        Generates a structured payment plan proposal for cardholders unable to pay the full amount.
        Includes repayment schedule, installment amounts, and terms.
      operationId: sendPaymentPlanProposal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanProposalRequest'
            examples:
              proposal12Months:
                summary: 12-month payment plan proposal
                value:
                  accountId: "ACC-012"
                  last4Digits: "3456"
                  overdueBalance: "$1500.00"
                  planDuration: 12
                  interestRate: 5.0
                  installmentAmount: "$131.25"
                  totalRepayment: "$1575.00"
                  generationDate: "2024-03-01"
                  deliveryChannel: "email"
      responses:
        '201':
          description: Payment plan proposal created and sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment-plans/{planId}/accept:
    post:
      tags:
        - Payment Plans
      summary: Accept payment plan proposal
      description: |
        Records cardholder acceptance of a payment plan and creates scheduled installments.
        Pauses collection lifecycle notifications.
      operationId: acceptPaymentPlan
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          description: Unique identifier for the payment plan
          schema:
            type: string
          example: "PLAN-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanAcceptanceRequest'
            examples:
              acceptance:
                summary: Payment plan acceptance
                value:
                  accountId: "ACC-031"
                  acceptanceDate: "2024-03-15"
                  firstPaymentDate: "2024-04-01"
                  agreementSignature: "digital_signature_token"
      responses:
        '200':
          description: Payment plan accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanAcceptanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment-plans/{planId}/default:
    post:
      tags:
        - Payment Plans
      summary: Process payment plan default
      description: |
        Processes payment plan default after missed installments.
        Reactivates collection lifecycle and terminates payment plan.
      operationId: processPaymentPlanDefault
      security:
        - BearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          description: Unique identifier for the payment plan
          schema:
            type: string
          example: "PLAN-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanDefaultRequest'
            examples:
              default:
                summary: Payment plan default after 2 missed payments
                value:
                  accountId: "ACC-034"
                  missedPayments: 2
                  resumeStage: "collection"
      responses:
        '200':
          description: Payment plan default processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanDefaultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /collection-agency/escalate:
    post:
      tags:
        - Collection Agency
      summary: Escalate to collection agency
      description: |
        Initiates collection agency involvement with secure data sharing.
        Only shares masked credit card information (last 4 digits).
      operationId: escalateToCollectionAgency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAgencyEscalationRequest'
            examples:
              escalation:
                summary: Collection agency escalation
                value:
                  accountId: "ACC-016"
                  last4Digits: "7890"
                  overdueBalance: "$1500.00"
                  notificationCount: 5
                  daysOverdue: 90
                  referralThreshold: 90
                  referralDate: "2024-04-01"
                  agencyName: "Professional Collections"
                  agencyContact: "+1-800-555-0201"
      responses:
        '201':
          description: Collection agency escalation initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionAgencyEscalationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /legal-actions/initiate:
    post:
      tags:
        - Legal Actions
      summary: Initiate legal action
      description: |
        Initiates legal action documentation for extreme delinquency.
        Requires legal department approval and generates formal legal documents.
      operationId: initiateLegalAction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalActionRequest'
            examples:
              legalAction:
                summary: Legal action initiation
                value:
                  accountId: "ACC-019"
                  last4Digits: "2468"
                  daysOverdue: 120
                  outstandingBalance: "$5000.00"
                  minBalance: "$3000.00"
                  minDays: 120
                  initiationDate: "2024-05-01"
                  legalDeadline: "2024-05-31"
                  legalApprovalId: "LEGAL-APPROVAL-001"
      responses:
        '201':
          description: Legal action initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Get account details
      description: |
        Retrieves cardholder account details with masked credit card information.
        Returns only last 4 digits of credit card number.
      operationId: getAccountDetails
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier for the cardholder account
          schema:
            type: string
          example: "ACC-001"
      responses:
        '200':
          description: Account details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Accounts
      summary: Update account status
      description: Updates the account status and lifecycle stage
      operationId: updateAccountStatus
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier for the cardholder account
          schema:
            type: string
          example: "ACC-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusUpdateRequest'
            examples:
              statusUpdate:
                summary: Update account to payment plan active
                value:
                  accountStatus: "PAYMENT_PLAN_ACTIVE"
                  lifecycleStage: "payment_plan"
                  reason: "Payment plan accepted by cardholder"
      responses:
        '200':
          description: Account status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{accountId}/lifecycle-progression:
    get:
      tags:
        - Accounts
      summary: Get collection lifecycle progression
      description: Retrieves the complete collection lifecycle progression history for an account
      operationId: getLifecycleProgression
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique identifier for the cardholder account
          schema:
            type: string
          example: "ACC-028"
      responses:
        '200':
          description: Lifecycle progression history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleProgressionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/multi-channel:
    post:
      tags:
        - Notifications
      summary: Send notification across multiple channels
      description: |
        Delivers notifications across multiple communication channels based on cardholder preferences.
        Supports email, SMS, and postal mail with consistent content across channels.
      operationId: sendMultiChannelNotification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiChannelNotificationRequest'
            examples:
              emailSms:
                summary: Send notification via email and SMS
                value:
                  accountId: "ACC-039"
                  last4Digits: "5678"
                  notificationType: "collection_notice"
                  preferredChannels:
                    - "email"
                    - "sms"
                  contactInfo:
                    email: "user039@example.com"
                    sms: "+1-555-0139"
                    postalMail: "789 Pine Rd"
      responses:
        '201':
          description: Multi-channel notification sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiChannelNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /audit/logs:
    get:
      tags:
        - Audit
      summary: Retrieve audit logs
      description: |
        Retrieves audit logs for collection activities.
        All logs contain only masked credit card information (last 4 digits).
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: query
          description: Filter by account ID
          schema:
            type: string
          example: "ACC-001"
        - name: startDate
          in: query
          description: Start date for log retrieval (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2024-01-01T00:00:00Z"
        - name: endDate
          in: query
          description: End date for log retrieval (ISO 8601)
          schema:
            type: string
            format: date-time
          example: "2024-12-31T23:59:59Z"
        - name: activityType
          in: query
          description: Filter by activity type
          schema:
            type: string
            enum:
              - notification_sent
              - payment_received
              - status_updated
              - notification_failed
              - agency_referral
              - legal_action
          example: "notification_sent"
        - name: limit
          in: query
          description: Maximum number of records to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          example: 100
        - name: offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/batch:
    post:
      tags:
        - Notifications
      summary: Process batch notifications
      description: |
        Processes high volume of notifications in batch mode.
        Includes performance monitoring and throughput optimization.
      operationId: processBatchNotifications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchNotificationRequest'
            examples:
              batchReminders:
                summary: Batch due reminder notifications
                value:
                  notificationType: "due_reminder"
                  accountIds:
                    - "ACC-001"
                    - "ACC-002"
                    - "ACC-003"
                  batchSize: 1000
                  priority: "high"
      responses:
        '202':
          description: Batch notification processing initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/batch/{batchId}/status:
    get:
      tags:
        - Notifications
      summary: Get batch notification status
      description: Retrieves the status and progress of a batch notification processing job
      operationId: getBatchNotificationStatus
      security:
        - BearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: Unique identifier for the batch job
          schema:
            type: string
          example: "BATCH-001"
      responses:
        '200':
          description: Batch status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/health:
    get:
      tags:
        - System Configuration
      summary: Health check endpoint
      description: Returns the health status of the notification service
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /system/configuration:
    get:
      tags:
        - System Configuration
      summary: Get system configuration
      description: Retrieves current system configuration including thresholds and timelines
      operationId: getSystemConfiguration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - System Configuration
      summary: Update system configuration
      description: Updates system configuration parameters
      operationId: updateSystemConfiguration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigurationUpdate'
      responses:
        '200':
          description: System configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for service-to-service authentication

  schemas:
    DueReminderRequest:
      type: object
      required:
        - accountId
        - last4Digits
        - dueDate
        - reminderDays
        - contactChannel
        - contactInfo
        - amountDue
      properties:
        accountId:
          type: string
          description: Unique identifier for the cardholder account
          example: "ACC-001"
        last4Digits:
          type: string
          pattern: '^\d{4}$'
          description: Last 4 digits of the credit card number
          example: "1234"
        dueDate:
          type: string
          format: date
          description: Payment due date
          example: "2024-02-15"
        reminderDays:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days before due date to send reminder
          example: 5
        contactChannel:
          type: string
          enum:
            - email
            - sms
            - postal_mail
          description: Preferred communication channel
          example: "email"
        contactInfo:
          type: string
          description: Contact information for the specified channel
          example: "cardholder1@example.com"
        amountDue:
          type: string
          pattern: '^\$\d+\.\d{2}$'
          description: Amount due in currency format
          example: "$500.00"

    OverdueAlertRequest:
      type: object
      required:
        - accountId
        - last4Digits
        - dueDate
        - detectionDate
        - overdueAmount
        - lateFee
        - consequences
        - contactChannel
      properties:
        accountId:
          type: string
          description: Unique identifier for the cardholder account
          example: "ACC-005"
        last4Digits:
          type: string
          pattern: '^\d{4}$'
          description: Last 4 digits of the credit card number
          example: "7890"
        dueDate:
          type: string
          format: date
          description: Original payment due date
          example: "2024-01-15"
        detectionDate:
          type: string
          format: date
          description: Date when overdue status was detected
          example: "2024-01-16"
        overdueAmount:
          type: string
          pattern: '^\$\d+\.\d{2}$'
          description: Overdue balance amount
          example: "$500.00"
        lateFee:
          type: string
          pattern: '^\$\d+\.\d{2}$'
          description: Late fee charged
          example: "$35.00"
        consequences:
          type: string
          description: Description of consequences for non-payment
          example: "late fees and interest charges"
        contactChannel:
          type: string
          enum:
            - email
            - sms
            - postal_mail
