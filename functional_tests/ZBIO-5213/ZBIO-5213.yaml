openapi: 3.0.3
info:
  title: Credit Card Collection Lifecycle Notification System API
  description: |
    API for managing automated collection lifecycle notifications for credit card accounts.
    This system handles due reminders, overdue alerts, collection notices, payment plans, 
    collection agency referrals, and legal actions while maintaining PCI DSS compliance 
    and security standards.
  version: 1.0.0
  contact:
    name: API Support Team
    email: api-support@creditcard.com

servers:
  - url: https://api.creditcard.com/v1
    description: Production server
  - url: https://api-staging.creditcard.com/v1
    description: Staging server
  - url: https://api-test.creditcard.com/v1
    description: Test server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Due Reminders
    description: Operations related to payment due reminders
  - name: Overdue Alerts
    description: Operations related to overdue balance alerts
  - name: Collection Notices
    description: Operations related to formal collection notifications
  - name: Payment Plans
    description: Operations related to payment plan proposals
  - name: Collection Agency
    description: Operations related to collection agency referrals
  - name: Legal Actions
    description: Operations related to legal action initiation
  - name: Notifications
    description: Multi-channel notification delivery operations
  - name: Audit
    description: Audit trail and logging operations
  - name: Security
    description: Security and compliance operations
  - name: Account Management
    description: Account and cardholder operations

paths:
  /accounts/{accountId}:
    get:
      tags:
        - Account Management
      summary: Retrieve cardholder account information
      description: Get detailed information about a cardholder account including masked card details
      operationId: getAccountById
      parameters:
        - name: accountId
          in: path
          required: true
          description: Unique account identifier
          schema:
            type: string
            example: "ACC-001"
      responses:
        '200':
          description: Account details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      security:
        - BearerAuth: []

  /accounts/{accountId}/payment-history:
    get:
      tags:
        - Account Management
      summary: Retrieve payment history for an account
      description: Get complete payment history including all transactions
      operationId: getPaymentHistory
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            example: "ACC-001"
        - name: startDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
            example: "2024-03-31"
      responses:
        '200':
          description: Payment history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHistory'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /accounts/{accountId}/payments:
    post:
      tags:
        - Account Management
      summary: Record a payment for an account
      description: Record a payment transaction and update account balance
      operationId: recordPayment
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            example: "ACC-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/due-reminders:
    post:
      tags:
        - Due Reminders
      summary: Trigger due reminder notification
      description: Send automated due reminder notification before payment due date
      operationId: sendDueReminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DueReminderRequest'
      responses:
        '202':
          description: Due reminder notification queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []

  /notifications/due-reminders/batch:
    post:
      tags:
        - Due Reminders
      summary: Trigger batch due reminder notifications
      description: Send due reminder notifications for multiple accounts
      operationId: sendBatchDueReminders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDueReminderRequest'
      responses:
        '202':
          description: Batch due reminder notifications queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/overdue-alerts:
    post:
      tags:
        - Overdue Alerts
      summary: Trigger overdue balance alert
      description: Send overdue balance alert after missed payment due date
      operationId: sendOverdueAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverdueAlertRequest'
      responses:
        '202':
          description: Overdue alert notification queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notifications/overdue-alerts/batch:
    post:
      tags:
        - Overdue Alerts
      summary: Trigger batch overdue alerts
      description: Process overdue detection and send alerts for multiple accounts
      operationId: sendBatchOverdueAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOverdueAlertRequest'
      responses:
        '202':
          description: Batch overdue alerts queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/collection-notices:
    post:
      tags:
        - Collection Notices
      summary: Send formal collection notification
      description: Send formal collection notification for significantly delinquent account
      operationId: sendCollectionNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionNoticeRequest'
      responses:
        '202':
          description: Collection notice queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payment-plans/proposals:
    post:
      tags:
        - Payment Plans
      summary: Generate payment plan proposal
      description: Generate and send payment plan proposal for overdue account
      operationId: generatePaymentPlanProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanProposalRequest'
      responses:
        '201':
          description: Payment plan proposal generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Account ineligible for payment plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanRejectionResponse'

  /payment-plans/{planId}/accept:
    post:
      tags:
        - Payment Plans
      summary: Accept payment plan proposal
      description: Accept a payment plan proposal and activate it
      operationId: acceptPaymentPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            example: "PLAN-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanAcceptanceRequest'
      responses:
        '200':
          description: Payment plan accepted and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanAcceptanceResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          description: Payment plan proposal expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-plans/eligibility:
    post:
      tags:
        - Payment Plans
      summary: Check payment plan eligibility
      description: Verify if an account is eligible for a payment plan
      operationId: checkPaymentPlanEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanEligibilityRequest'
      responses:
        '200':
          description: Eligibility check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanEligibilityResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /collection-agency/referrals:
    post:
      tags:
        - Collection Agency
      summary: Refer account to collection agency
      description: Escalate severely delinquent account to collection agency
      operationId: referToCollectionAgency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAgencyReferralRequest'
      responses:
        '201':
          description: Account referred to collection agency successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionAgencyReferralResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []

  /collection-agency/referrals/{referralId}:
    get:
      tags:
        - Collection Agency
      summary: Get collection agency referral details
      description: Retrieve details of a collection agency referral
      operationId: getCollectionAgencyReferral
      parameters:
        - name: referralId
          in: path
          required: true
          schema:
            type: string
            example: "REF-001"
      responses:
        '200':
          description: Referral details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionAgencyReferralDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /legal-actions:
    post:
      tags:
        - Legal Actions
      summary: Initiate legal action
      description: Initiate legal action for extreme default cases
      operationId: initiateLegalAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalActionRequest'
      responses:
        '201':
          description: Legal action initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Legal action not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth: []

  /legal-actions/{caseId}:
    get:
      tags:
        - Legal Actions
      summary: Get legal action details
      description: Retrieve details of a legal action case
      operationId: getLegalAction
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            example: "LEGAL-001"
      responses:
        '200':
          description: Legal action details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalActionDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/multi-channel:
    post:
      tags:
        - Notifications
      summary: Send multi-channel notification
      description: Send notification through multiple communication channels (email, SMS, app, postal)
      operationId: sendMultiChannelNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiChannelNotificationRequest'
      responses:
        '202':
          description: Multi-channel notification queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiChannelNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notifications/{notificationId}/status:
    get:
      tags:
        - Notifications
      summary: Get notification delivery status
      description: Retrieve delivery status for a specific notification
      operationId: getNotificationStatus
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            example: "NOTIF-001"
      responses:
        '200':
          description: Notification status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/{notificationId}/retry:
    post:
      tags:
        - Notifications
      summary: Retry failed notification
      description: Manually retry a failed notification delivery
      operationId: retryNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            example: "NOTIF-001"
      responses:
        '202':
          description: Notification retry queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRetryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /audit/logs:
    get:
      tags:
        - Audit
      summary: Retrieve audit logs
      description: Get audit logs for collection lifecycle activities
      operationId: getAuditLogs
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            example: "ACC-001"
        - name: activityType
          in: query
          schema:
            type: string
            enum: [DUE_REMINDER_SENT, OVERDUE_ALERT_SENT, COLLECTION_NOTICE_SENT, PAYMENT_PLAN_GENERATED, REFERRED_TO_AGENCY, LEGAL_ACTION_INITIATED]
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /audit/logs/{logId}:
    get:
      tags:
        - Audit
      summary: Get specific audit log entry
      description: Retrieve detailed information about a specific audit log entry
      operationId: getAuditLogById
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: string
            example: "LOG-001"
      responses:
        '200':
          description: Audit log retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /security/compliance/check:
    post:
      tags:
        - Security
      summary: Perform security compliance check
      description: Verify security compliance including card number masking and PCI DSS requirements
      operationId: performComplianceCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCheckRequest'
      responses:
        '200':
          description: Compliance check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
      security:
        - BearerAuth: []

  /security/encryption/verify:
    post:
      tags:
        - Security
      summary: Verify data encryption status
      description: Verify that sensitive data is properly encrypted
      operationId: verifyEncryption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptionVerificationRequest'
      responses:
        '200':
          description: Encryption verification completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptionVerificationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /accounts/{accountId}/lifecycle-stage:
    get:
      tags:
        - Account Management
      summary: Get current collection lifecycle stage
      description: Retrieve the current collection lifecycle stage for an account
      operationId: getLifecycleStage
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            example: "ACC-001"
      responses:
        '200':
          description: Lifecycle stage retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleStageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /accounts/{accountId}/lifecycle-history:
    get:
      tags:
        - Account Management
      summary: Get collection lifecycle history
      description: Retrieve complete collection lifecycle progression history for an account
      operationId: getLifecycleHistory
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            example: "ACC-001"
      responses:
        '200':
          description: Lifecycle history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Check system health and operational status
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication

  schemas:
    AccountDetails:
      type: object
      required:
        - accountId
        - cardLast4Digits
        - accountStatus
        - currentBalance
        - dueDate
      properties:
        accountId:
          type: string
          example: "ACC-001"
        cardLast4Digits:
          type: string
          pattern: '^\d{4}$'
          example: "1234"
          description: Last 4 digits of credit card (PCI DSS compliant)
        maskedCardNumber:
          type: string
          example: "**** **** **** 1234"
          description: Fully masked card number
        accountStatus:
          type: string
          enum: [ACTIVE, OVERDUE, DELINQUENT, COLLECTION, LEGAL_ACTION, PAID, CLOSED]
          example: "ACTIVE"
        currentBalance:
          type: number
          format: decimal
          example: 1250.50
        overdueBalance:
          type: number
          format: decimal
          example: 0.00
        dueDate:
          type: string
          format: date
          example: "2024-02-15"
        dueAmount:
          type: number
          format: decimal
          example: 250.00
        lastPaymentDate:
          type: string
          format: date
          example: "2024-01-15"
        lastPaymentAmount:
          type: number
          format: decimal
          example: 300.00
        contactInformation:
          $ref: '#/components/schemas/ContactInformation'
        lifecycleStage:
          type: string
          enum: [ACTIVE, DUE_REMINDER_SENT, OVERDUE_ALERT_SENT, COLLECTION_NOTICE_SENT, PAYMENT_PLAN_OFFERED, REFERRED_TO_AGENCY, LEGAL_ACTION_INITIATED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContactInformation:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "john.doe@email.com"
        phone:
          type: string
          example: "+1-555-0101"
        mailingAddress:
          $ref: '#/components/schemas/Address'
        appNotificationsEnabled:
          type: boolean
          example: true
        preferredLanguage:
          type: string
          example: "ENGLISH"

    Address:
      type: object
      properties:
        street:
          type: string
          example: "123 Main St"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zipCode:
          type: string
          example: "10001"
        country:
          type: string
          example: "USA"

    PaymentHistory:
      type: object
      properties:
        accountId:
          type: string
          example: "ACC-001"
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRecord'
        totalPayments:
          type: integer
          example: 12
        totalAmount:
          type: number
          format: decimal
          example: 3500.00

    PaymentRecord:
      type: object
      properties:
        paymentId:
          type: string
          example: "PAY-001"
        paymentDate:
          type: string
          format: date
          example: "2024-01-15"
        amount:
          type: number
          format: decimal
          example: 250.00
        paymentType:
          type: string
          enum: [FULL, PARTIAL, INSTALLMENT, MINIMUM]
          example: "FULL"
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, CREDIT_CARD, DEBIT_CARD, CHECK, CASH]
          example: "BANK_TRANSFER"
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, REVERSED]
          example: "COMPLETED"
        transactionId:
          type: string
          example: "TXN-123456"

    PaymentRequest:
      type: object
      required:
        - amount
        - paymentType
        - paymentMethod
        - paymentDate
      properties:
        amount:
          type: number
          format: decimal
          example: 250.00
        paymentType:
          type: string
          enum: [FULL, PARTIAL, INSTALLMENT, MINIMUM]
          example: "FULL"
        paymentMethod:
          type: string
          enum: [BANK_TRANSFER, CREDIT_CARD, DEBIT_CARD, CHECK, CASH]
          example: "BANK_TRANSFER"
        paymentDate:
          type: string
          format: date
          example: "2024-03-15"
        transactionId:
          type: string
          example: "TXN-123456"
        notes:
          type: string
          example: "Payment received via online banking"

    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
          example: "PAY-001"
        accountId:
          type: string
          example: "ACC-001"
        amount:
          type: number
          format: decimal
          example: 250.00
        status:
          type: string
