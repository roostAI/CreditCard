          maximum: 10000
          description: Number of notifications to process per batch
          example: 1000
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          default: normal
          example: "high"

    BatchNotificationResponse:
      type: object
      properties:
        batchId:
          type: string
          description: Unique identifier for the batch job
          example: "BATCH-001"
        notificationType:
          type: string
          example: "due_reminder"
        totalAccounts:
          type: integer
          description: Total number of accounts in batch
          example: 10000
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
            - COMPLETED
            - FAILED
          example: "QUEUED"
        queuedTimestamp:
          type: string
          format: date-time
          example: "2024-03-01T08:00:00Z"
        estimatedCompletionTime:
          type: string
          format: date-time
          example: "2024-03-01T09:20:00Z"

    BatchStatusResponse:
      type: object
      properties:
        batchId:
          type: string
          example: "BATCH-001"
        notificationType:
          type: string
          example: "due_reminder"
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
            - COMPLETED
            - FAILED
          example: "PROCESSING"
        totalAccounts:
          type: integer
          example: 10000
        processedAccounts:
          type: integer
          description: Number of accounts processed so far
          example: 7500
        successfulDeliveries:
          type: integer
          description: Number of successful notification deliveries
          example: 7450
        failedDeliveries:
          type: integer
          description: Number of failed notification deliveries
          example: 50
        startTimestamp:
          type: string
          format: date-time
          example: "2024-03-01T08:00:00Z"
        currentTimestamp:
          type: string
          format: date-time
          example: "2024-03-01T08:45:00Z"
        estimatedCompletionTime:
          type: string
          format: date-time
          example: "2024-03-01T09:20:00Z"
        performanceMetrics:
          $ref: '#/components/schemas/PerformanceMetrics'
        allNotificationsMasked:
          type: boolean
          description: Confirms all notifications display only last 4 digits
          example: true

    PerformanceMetrics:
      type: object
      properties:
        throughputPerMinute:
          type: number
          format: float
          description: Notifications processed per minute
          example: 555.5
        averageProcessingTimeMs:
          type: number
          format: float
          description: Average processing time in milliseconds
          example: 108.2
        cpuUtilizationPercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 75.5
        memoryUsageMB:
          type: number
          format: float
          description: Memory usage in megabytes
          example: 2048.5
        databaseResponseTimeMs:
          type: number
          format: float
          description: Average database response time in milliseconds
          example: 450.3
        errorRatePercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 0.15

    AuditLogsResponse:
      type: object
      properties:
        totalRecords:
          type: integer
          description: Total number of audit log records
          example: 1000
        returnedRecords:
          type: integer
          description: Number of records returned in this response
          example: 100
        offset:
          type: integer
          description: Current offset for pagination
          example: 0
        limit:
          type: integer
          description: Maximum records per page
          example: 100
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'

    AuditLogEntry:
      type: object
      properties:
        auditLogId:
          type: string
          description: Unique identifier for audit log entry
          example: "AUDIT-001"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the audited activity
          example: "2024-02-10T10:00:00Z"
        accountId:
          type: string
          description: Cardholder account ID
          example: "ACC-001"
        maskedCardNumber:
          type: string
          pattern: '^\*{4} \*{4} \*{4} \d{4}$'
          description: Masked credit card number (only last 4 digits)
          example: "**** **** **** 1234"
        fullCardNumberLogged:
          type: boolean
          description: Confirms full card number is NOT logged
          example: false
        activityType:
          type: string
          enum:
            - notification_sent
            - payment_received
            - status_updated
            - notification_failed
            - agency_referral
            - legal_action
            - payment_plan_accepted
            - payment_plan_defaulted
          example: "notification_sent"
        actor:
          type: string
          description: User or system that performed the activity
          example: "system_automated"
        activityDetails:
          type: object
          description: Detailed information about the activity
          additionalProperties: true
          example:
            notificationType: "due_reminder"
            deliveryChannel: "email"
            deliveryStatus: "SUCCESS"
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILED
            - PARTIAL_SUCCESS
          example: "SUCCESS"
        errorMessage:
          type: string
          description: Error message if activity failed
          example: null
        retentionUntil:
          type: string
          format: date
          description: Date until which log must be retained
          example: "2031-02-10"
        tamperProof:
          type: boolean
          description: Indicates if log entry is tamper-proof
          example: true
        integrityHash:
          type: string
          description: Hash for integrity verification
          example: "sha256:abc123def456..."

    SystemConfiguration:
      type: object
      properties:
        notificationServiceEnabled:
          type: boolean
          description: Indicates if notification service is operational
          example: true
        cardNumberMaskingEnabled:
          type: boolean
          description: Indicates if card number masking is enabled
          example: true
        auditLoggingEnabled:
          type: boolean
          description: Indicates if audit logging is enabled
          example: true
        encryptionConfiguration:
          type: object
          properties:
            algorithm:
              type: string
              example: "AES-256"
            tlsVersion:
              type: string
              example: "TLS 1.3"
        lifecycleThresholds:
          type: object
          properties:
            reminderDaysBeforeDue:
              type: integer
              example: 5
            overdueAlertDaysAfterDue:
              type: integer
              example: 1
            collectionNoticeDaysAfterDue:
              type: integer
              example: 30
            agencyReferralDaysAfterDue:
              type: integer
              example: 90
            legalActionDaysAfterDue:
              type: integer
              example: 120
        paymentPlanConfiguration:
          type: object
          properties:
            maxDurationMonths:
              type: integer
              example: 60
            minInterestRate:
              type: number
              format: float
              example: 0.0
            maxInterestRate:
              type: number
              format: float
              example: 15.0
            defaultMissedPaymentsThreshold:
              type: integer
              example: 2
        retryConfiguration:
          type: object
          properties:
            maxRetries:
              type: integer
              example: 3
            exponentialBackoff:
              type: boolean
              example: true
        complianceConfiguration:
          type: object
          properties:
            fdcpaCompliant:
              type: boolean
              example: true
            pciDssCompliant:
              type: boolean
              example: true
            allowedContactHoursStart:
              type: string
              pattern: '^\d{2}:\d{2}$'
              example: "08:00"
            allowedContactHoursEnd:
              type: string
              pattern: '^\d{2}:\d{2}$'
              example: "21:00"
            dataRetentionYears:
              type: integer
              example: 7

    SystemConfigurationUpdate:
      type: object
      properties:
        lifecycleThresholds:
          type: object
          properties:
            reminderDaysBeforeDue:
              type: integer
              minimum: 1
              maximum: 30
            overdueAlertDaysAfterDue:
              type: integer
              minimum: 1
              maximum: 30
            collectionNoticeDaysAfterDue:
              type: integer
              minimum: 1
              maximum: 180
            agencyReferralDaysAfterDue:
              type: integer
              minimum: 1
              maximum: 365
            legalActionDaysAfterDue:
              type: integer
              minimum: 1
              maximum: 365
        retryConfiguration:
          type: object
          properties:
            maxRetries:
              type: integer
              minimum: 1
              maximum: 10

    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          example: "2024-03-01T10:00:00Z"
        services:
          type: object
          properties:
            notificationService:
              $ref: '#/components/schemas/ServiceHealth'
            database:
              $ref: '#/components/schemas/ServiceHealth'
            emailService:
              $ref: '#/components/schemas/ServiceHealth'
            smsService:
              $ref: '#/components/schemas/ServiceHealth'
            auditService:
              $ref: '#/components/schemas/ServiceHealth'

    ServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - up
            - down
            - degraded
          example: "up"
        responseTimeMs:
          type: number
          format: float
          example: 45.2
        lastChecked:
          type: string
          format: date-time
          example: "2024-03-01T10:00:00Z"

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Application-specific error code
          example: "INVALID_ACCOUNT_STATE"
        errorMessage:
          type: string
          description: Human-readable error message
          example: "Cannot send notification to closed account"
        timestamp:
          type: string
          format: date-time
          example: "2024-03-01T10:00:00Z"
        path:
          type: string
          description: API endpoint path that generated the error
          example: "/v1/notifications/due-reminder"
        requestId:
          type: string
          description: Unique identifier for the request
          example: "REQ-12345"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidInput:
              value:
                errorCode: "INVALID_INPUT"
                errorMessage: "Invalid account ID format"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/notifications/due-reminder"
                requestId: "REQ-12345"

    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                errorCode: "UNAUTHORIZED"
                errorMessage: "Valid authentication token required"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/notifications/due-reminder"
                requestId: "REQ-12346"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                errorCode: "FORBIDDEN"
                errorMessage: "Insufficient permissions to perform this action"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/legal-actions/initiate"
                requestId: "REQ-12347"

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                errorCode: "NOT_FOUND"
                errorMessage: "Account not found"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/accounts/ACC-999"
                requestId: "REQ-12348"

    InvalidAccountState:
      description: Unprocessable entity - Account in invalid state for operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountClosed:
              value:
                errorCode: "INVALID_ACCOUNT_STATE"
                errorMessage: "Cannot send notification to closed account"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/notifications/due-reminder"
                requestId: "REQ-12349"
                details:
                  accountStatus: "CLOSED"
                  rejectionReason: "account_closed"
            accountFraudulent:
              value:
                errorCode: "INVALID_ACCOUNT_STATE"
                errorMessage: "Cannot process notification for fraudulent account"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/notifications/overdue-alert"
                requestId: "REQ-12350"
                details:
                  accountStatus: "FRAUDULENT"
                  rejectionReason: "account_marked_fraudulent"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                errorCode: "INTERNAL_SERVER_ERROR"
                errorMessage: "An unexpected error occurred"
                timestamp: "2024-03-01T10:00:00Z"
                path: "/v1/notifications/due-reminder"
                requestId: "REQ-12351"
