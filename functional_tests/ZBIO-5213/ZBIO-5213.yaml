          type: string
          example: "ACC-036"
        checkType:
          type: string
          enum: [CARD_MASKING, PCI_DSS, DATA_ENCRYPTION, ACCESS_CONTROL, REGULATORY]
          example: "CARD_MASKING"
        lifecycleStage:
          type: string
          enum: [DUE_REMINDER, OVERDUE_ALERT, COLLECTION_NOTICE, PAYMENT_PLAN_OFFER, COLLECTION_AGENCY, LEGAL_ACTION]

    ComplianceCheckResponse:
      type: object
      properties:
        checkId:
          type: string
          example: "CHECK-001"
        accountId:
          type: string
          example: "ACC-036"
        checkType:
          type: string
          example: "CARD_MASKING"
        status:
          type: string
          enum: [PASS, FAIL, WARNING]
          example: "PASS"
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceFinding'
        checkedAt:
          type: string
          format: date-time
        checkedBy:
          type: string
          example: "COMPLIANCE-SYSTEM"

    ComplianceFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
          example: "INFO"
        category:
          type: string
          example: "Card Number Masking"
        description:
          type: string
          example: "Card number properly masked in all notifications"
        recommendation:
          type: string
        affectedComponents:
          type: array
          items:
            type: string

    EncryptionVerificationRequest:
      type: object
      required:
        - accountId
        - verificationType
      properties:
        accountId:
          type: string
          example: "ACC-042"
        verificationType:
          type: string
          enum: [AT_REST, IN_TRANSIT, END_TO_END]
          example: "AT_REST"

    EncryptionVerificationResponse:
      type: object
      properties:
        verificationId:
          type: string
          example: "VERIFY-001"
        accountId:
          type: string
          example: "ACC-042"
        verificationType:
          type: string
          example: "AT_REST"
        encrypted:
          type: boolean
          example: true
        encryptionAlgorithm:
          type: string
          example: "AES-256"
        encryptionStandard:
          type: string
          example: "FIPS 140-2"
        keyManagement:
          type: string
          enum: [COMPLIANT, NON_COMPLIANT]
          example: "COMPLIANT"
        verifiedAt:
          type: string
          format: date-time

    LifecycleStageResponse:
      type: object
      properties:
        accountId:
          type: string
          example: "ACC-001"
        currentStage:
          type: string
          enum: [ACTIVE, DUE_REMINDER_SENT, OVERDUE_ALERT_SENT, COLLECTION_NOTICE_SENT, PAYMENT_PLAN_OFFERED, REFERRED_TO_AGENCY, LEGAL_ACTION_INITIATED]
          example: "OVERDUE_ALERT_SENT"
        stageEnteredDate:
          type: string
          format: date-time
        daysinStage:
          type: integer
          example: 5
        nextScheduledAction:
          type: string
          example: "Send collection notice"
        nextActionDate:
          type: string
          format: date

    LifecycleHistoryResponse:
      type: object
      properties:
        accountId:
          type: string
          example: "ACC-LIFECYCLE-001"
        currentStage:
          type: string
          example: "LEGAL_ACTION_INITIATED"
        stages:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleStageHistory'

    LifecycleStageHistory:
      type: object
      properties:
        stage:
          type: string
          enum: [ACTIVE, DUE_REMINDER_SENT, OVERDUE_ALERT_SENT, COLLECTION_NOTICE_SENT, PAYMENT_PLAN_OFFERED, REFERRED_TO_AGENCY, LEGAL_ACTION_INITIATED]
          example: "DUE_REMINDER_SENT"
        enteredDate:
          type: string
          format: date-time
        exitedDate:
          type: string
          format: date-time
        durationDays:
          type: integer
          example: 5
        actions:
          type: array
          items:
            type: string
          example: ["Reminder sent via email", "Reminder sent via SMS"]
        outcome:
          type: string
          example: "No payment received, escalated to next stage"

    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
          example: "UP"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        components:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/ComponentHealth'
            notificationSystem:
              $ref: '#/components/schemas/ComponentHealth'
            emailService:
              $ref: '#/components/schemas/ComponentHealth'
            smsService:
              $ref: '#/components/schemas/ComponentHealth'
            apiGateway:
              $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
          example: "UP"
        responseTime:
          type: integer
          description: Response time in milliseconds
          example: 45
        lastChecked:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Invalid input parameters"
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: "accountId"
                  message:
                    type: string
                    example: "Account ID is required"
            timestamp:
              type: string
              format: date-time
            traceId:
              type: string
              example: "trace-123-456-789"

  responses:
    UnauthorizedError:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Authentication credentials are missing or invalid"
              timestamp: "2024-03-15T10:30:00Z"

    ForbiddenError:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "FORBIDDEN"
              message: "User does not have permission to access this resource"
              timestamp: "2024-03-15T10:30:00Z"

    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "NOT_FOUND"
              message: "The requested resource was not found"
              timestamp: "2024-03-15T10:30:00Z"

    BadRequestError:
      description: The request was invalid or cannot be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "BAD_REQUEST"
              message: "The request was invalid or cannot be processed"
              timestamp: "2024-03-15T10:30:00Z"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Request validation failed"
              details:
                - field: "dueAmount"
                  message: "Due amount must be greater than 0"
              timestamp: "2024-03-15T10:30:00Z"
